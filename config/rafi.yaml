# 서버가 인식하는 칸과 장비 목록
# 좌표 원점: 뒷벽·좌측 칸막이·바닥 모서리 (단위 cm)
# x: 좌측 칸막이 → 우측 칸막이, y: 뒷벽 → 문, z: 바닥 → 천장
rooms:
  stall-1:
    name: 칸 1
    size_cm: {x: 97, y: 137.5, z: 228}

    # 경보 구역. 키가 레이더가 보내는 roi 값이며, 여기에 없는 roi는 거부한다
    # 좌표는 레이더 설정(config/radar/stall_*.json)의 구역과 같게 유지한다
    zones:
      dispenser_low:
        name: 휴지 디스펜서 아래
        x_cm: [0, 32]
        y_cm: [60, 95]
        z_cm: [55, 95]
      dispenser_top:
        name: 휴지 디스펜서 위
        x_cm: [0, 32]
        y_cm: [65, 115]
        z_cm: [95, 135]
      sanbox_low:
        name: 위생용품 함 아래
        x_cm: [82, 97]
        y_cm: [39, 75]
        z_cm: [55, 95]
      sanbox_top:
        name: 위생용품 함 위
        x_cm: [85, 97]
        y_cm: [39, 62]
        z_cm: [95, 145]
      under_shelf:
        name: 선반 아래
        x_cm: [0, 97]
        y_cm: [0, 30]
        z_cm: [115, 142]
      high:
        name: 높은 곳 (환풍구, 벽 위)
        x_cm: [0, 97]
        y_cm: [0, 110]
        z_cm: [165, 228]
      stall:
        name: 칸 전체
        x_cm: [0, 97]
        y_cm: [0, 137.5]
        z_cm: [0, 228]

    # 평면도 배경
    fixtures:
      vent:
        name: 환풍구
        x_cm: [90, 97]  # 이 칸 쪽으로 걸친 폭은 미측정
        y_cm: [42.5, 70.3]
        z_cm: [228, 228]
      shelf:
        name: 선반
        x_cm: [0, 97]
        y_cm: [0, 22]
        z_cm: [142, 142]
      dispenser:
        name: 휴지 디스펜서
        x_cm: [0, 14]
        y_cm: [79, 103.5]
        z_cm: [98, 126]
      sanitary_box:
        name: 위생용품 함
        x_cm: [82, 97]
        y_cm: [42, 72]
        z_cm: [96, 142]
      toilet:
        name: 변기
        x_cm: [32.5, 64.5]
        y_cm: [0, 77]
        z_cm: [0, 32]
      door:
        name: 문
        x_cm: [38, 97]
        y_cm: [137.5, 137.5]
        z_cm: [0, 201]

devices:
  radar-1:
    kind: radar
    room: stall-1
    position_cm: {x: 63, y: 23, z: 200}
  pi-1:
    kind: rf
    room: stall-1

# 상태 메시지(10초 주기)가 이 시간 동안 없으면 끊김으로 표시
device_timeout_sec: 30

# 사건 구간 간격이 이 이하인 판단을 같은 사건으로 묶는다 (임시값, 실측 후 조정)
fusion_window_sec: 120

# 청소 시간대 (서버 시각 기준). 경보에 표시만 하고 등급은 바꾸지 않는다
# 시각은 따옴표로 감싼다. 따옴표가 없으면 YAML이 숫자로 읽는다
cleaning_windows:
  - {start: "10:00", end: "10:30"}
  - {start: "16:00", end: "16:30"}
