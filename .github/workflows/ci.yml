name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,server]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # 저장소 Secrets에 DISCORD_WEBHOOK을 등록하면 main 실패 시 Discord로 알림
      - name: Notify Discord on failure
        if: failure() && github.ref == 'refs/heads/main' && env.DISCORD_WEBHOOK != ''
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"main 브랜치 CI 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK"
